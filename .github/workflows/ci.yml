name: CI

on:
  push:
  pull_request:

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: claude plugin validate (strict, except the root CLAUDE.md notice)
        run: |
          out=$(claude plugin validate . 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          extra=$(echo "$out" | grep -E '^\s*> ' | grep -vF 'root: CLAUDE.md at the plugin root is not loaded as project context' || true)
          if [ -n "$extra" ]; then echo "Unexpected validator warnings:"; echo "$extra"; exit 1; fi
      - run: claude plugin validate .claude-plugin/plugin.json
      - run: pip install pytest
      - run: python tools/budget.py
      - run: python -m pytest tools/
      - run: |
          shopt -s nullglob globstar
          for s in hooks/*.sh skills/**/*.sh tools/**/*.sh; do "$s" --selftest || exit 1; done
